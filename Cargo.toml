[workspace]
members = ["diskripper-core", "diskripper-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/LoopyLuci/DiskRippers"
description = "DiskRipper - Next generation media backup software"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
filetime = "0.2"
flate2 = "1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
bytes = "1"
async-trait = "0.1"
futures = "0.3"
tokio-util = "0.7"
dirs = "5"
base64 = "0.21"
clap = { version = "4", features = ["derive"] }
